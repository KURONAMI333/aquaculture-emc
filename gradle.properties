mod_description=Adds ProjectE EMC values to Aquaculture 2's fish, fillets, fishing junk and neptunium ingot, which have no recipe ProjectE can read. From them it derives the cooked fillet, sushi, turtle soup, Neptune's Bounty, the neptunium block and nugget and the neptunium gear; mounts, hooks, fishing lines and tackle boxes are already valued from vanilla materials. Loot boxes, the worm, the six dead hook assets and the fish that brew vanilla potions are intentionally left out. Requires ProjectE and Aquaculture 2.
